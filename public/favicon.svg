<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer Rounded Shield / Pin Boundary -->
  <defs>
    <linearGradient id="civicGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#142B45" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F9D91" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="12" y1="6" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0F9D91" />
    </linearGradient>
  </defs>

  <!-- Background circle/rounded rect for favicon contrast -->
  <rect width="48" height="48" rx="12" fill="#142B45"/>

  <!-- Geometric City Skyline inside Location Pin Shape -->
  <!-- Pin Silhouette Base -->
  <path d="M24 6C16.82 6 11 11.82 11 19C11 27.2 22.1 39.8 22.6 40.35C23.35 41.2 24.65 41.2 25.4 40.35C25.9 39.8 37 27.2 37 19C37 11.82 31.18 6 24 6Z" fill="url(#pinGrad)" opacity="0.95"/>

  <!-- Geometric Skyline Cutout / Overlay -->
  <!-- Left building -->
  <rect x="16" y="20" width="3.5" height="8" rx="0.75" fill="#FFFFFF" fill-opacity="0.9"/>
  <!-- Middle tall building with spire -->
  <rect x="21" y="14" width="6" height="14" rx="0.75" fill="#FFFFFF"/>
  <polygon points="24,10 22.5,14 25.5,14" fill="#FFFFFF"/>
  <!-- Right building -->
  <rect x="28.5" y="17" width="4" height="11" rx="0.75" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Connected Nodes & Civic Check Accent -->
  <line x1="17.75" y1="20" x2="24" y2="16" stroke="#0F9D91" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="16" x2="30.5" y2="18" stroke="#0F9D91" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="17.75" cy="20" r="1.5" fill="#38BDF8"/>
  <circle cx="24" cy="16" r="1.75" fill="#FFFFFF"/>
  <circle cx="30.5" cy="18" r="1.5" fill="#38BDF8"/>

  <!-- Subtle Checkmark at base of pin node -->
  <path d="M21 24.5L23.2 26.5L27 22.5" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
